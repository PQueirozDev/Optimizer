name: Build Windows Installer

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix, for example 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: PowerShell script tests
        shell: powershell
        run: ./tests/Verify-PowerShell.ps1 -OutputDirectory "$env:RUNNER_TEMP\powershell-verification"

      - name: App verification tests
        shell: powershell
        run: |
          dotnet run --project tests/Optimizer.Verification -- "$env:RUNNER_TEMP\app-verification"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build:
    name: Build installer
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve version
        id: version
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build installer
        shell: powershell
        run: ./scripts/build-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      # O aplicativo só instala atualizações automaticamente quando o hash confere com este arquivo.
      - name: Generate checksums
        shell: powershell
        run: |
          $installer = Get-Item "artifacts/installer/PQueirozOptimizer-Setup-v${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Out-File -FilePath "artifacts/installer/SHA256SUMS.txt" -Encoding ascii -NoNewline
          Get-Content "artifacts/installer/SHA256SUMS.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PQueirozOptimizer-Setup-v${{ steps.version.outputs.version }}
          path: |
            artifacts/installer/PQueirozOptimizer-Setup-v${{ steps.version.outputs.version }}.exe
            artifacts/installer/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"
          # As notas da release sao as mesmas do app; a janela de atualizacao do app mostra esta lista
          ./scripts/release-notes.ps1 -Version $version -Output release-notes.md
          gh release create $tag `
            "artifacts/installer/PQueirozOptimizer-Setup-v$version.exe" `
            "artifacts/installer/SHA256SUMS.txt" `
            --title "PQueiroz Optimizer $tag" `
            --notes-file release-notes.md
